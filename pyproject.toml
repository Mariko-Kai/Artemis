[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artemis"
version = "0.1.0"
description = "Local AI Agent with CLI and Memory"
readme = "PROJECT_CONTEXT.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Artemis Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
artemis = "cli.main:main"

[tool.setuptools]
packages = ["cli", "cli.commands", "cli.utils", "backend", "backend.app", "memory_module"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
